name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/setup-expo@v2

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          cat > .env << 'ENVEOF'
          EXPO_PUBLIC_APPWRITE_ENDPOINT=https://sgp.cloud.appwrite.io/v1
          EXPO_PUBLIC_APPWRITE_PROJECT_ID=6a6ebd81003a7ff40656
          EXPO_PUBLIC_APPWRITE_PROJECT_NAME=CCS Smartvisit
          EXPO_PUBLIC_APPWRITE_DATABASE_ID=field_agent_db
          EXPO_PUBLIC_APPWRITE_STORAGE_BUCKET_ID=visit-photos
          ENVEOF

      - name: Build APK on EAS
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
